name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kotoba-operator:
    # Default CI is kotoba compile + instantiateKotoba. Not clojure -M.
    # Not `kotoba run` of the .kotoba source (CLI source-run gap).
    # Language pin: kotoba-lang@6b2f2e8e807361a9728b9d00c498a9e8d48bfc02
    # (green main test run 33723368124). Emit CLI is Release kotoba.
    # This job does not claim compiler 8d9f3e8f. There is no kotoba -M.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Release kotoba CLI
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/kotoba-linux-amd64.tar.gz \
            "https://github.com/kotoba-lang/kotoba/releases/download/v0.7.3/kotoba-linux-amd64.tar.gz"
          tar -xzf /tmp/kotoba-linux-amd64.tar.gz -C /tmp
          bin=$(find /tmp -type f -name kotoba | head -n 1)
          test -n "$bin"
          install -m 755 "$bin" "$HOME/.local/bin/kotoba"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/bin/kotoba"
      - name: kotoba compile (wasm and web)
        run: sh scripts/kotoba-compile.sh
      - name: prove artifacts exist before any emit claim
        run: |
          set -eu
          test -s target/kotoba/launcher.wasm
          test -s target/kotoba/launcher.mjs
          echo "bytes launcher.wasm=$(wc -c < target/kotoba/launcher.wasm)"
          echo "bytes launcher.mjs=$(wc -c < target/kotoba/launcher.mjs)"
      - name: guest run (instantiateKotoba + exports)
        run: sh scripts/kotoba-run.sh
      - name: Linux kexe-verify is HOLD (exit 78, not fake ok)
        run: |
          set +e
          sh scripts/amu-native.sh kotoba/launcher.kotoba
          test $? -eq 78
