<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tamaki Observatory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene"></canvas>
  <header><h1>Tamaki Observatory</h1><div id="metrics">Connecting…</div>
    <label>Group
      <select id="grouping"><option value="org">organization</option>
        <option value="project">project</option><option value="sync">west sync</option>
      </select>
    </label>
  </header>
  <aside id="inspector"><h2>Workspace</h2><div id="details">Select a repository tile</div></aside>
  <div id="legend">drag rotate · wheel zoom · click repo/agent<br><span class="live">● agent/WIP</span>　<span class="sync">● synced</span>　<span class="diff">● west Δ</span>　<span class="loop">○ loop</span><br>tile height = issue + patch congestion</div>
  <script src="js/main.js"></script>
</body>
</html>
